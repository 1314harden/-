<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星际防线 - Starfall Defense</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="game-container">
        <!-- 游戏画布 -->
        <canvas id="game-canvas"></canvas>

        <!-- UI覆盖层 -->
        <div id="ui-overlay">
            <!-- 顶部信息栏 -->
            <div id="top-bar">
                <div class="resource">
                    <span class="icon">💰</span>
                    <span id="gold">300</span>
                </div>
                <div class="resource">
                    <span class="icon">❤️</span>
                    <span id="lives">20</span>
                </div>
                <div class="resource">
                    <span class="icon">🌊</span>
                    <span id="wave">0</span>/20
                </div>
                <button id="pause-btn" class="control-btn">⏸️</button>
            </div>

            <!-- 塔选择面板 -->
            <div id="tower-panel">
                <div class="tower-slot" data-tower="guardian">
                    <div class="tower-icon" style="background: #4a9eff;">🔫</div>
                    <div class="tower-info">
                        <div class="tower-name">机枪塔</div>
                        <div class="tower-cost">💰 100</div>
                    </div>
                </div>
                <div class="tower-slot" data-tower="photon">
                    <div class="tower-icon" style="background: #ff4a4a;">⚡</div>
                    <div class="tower-info">
                        <div class="tower-name">激光塔</div>
                        <div class="tower-cost">💰 200</div>
                    </div>
                </div>
                <div class="tower-slot" data-tower="cryo">
                    <div class="tower-icon" style="background: #4affff;">❄️</div>
                    <div class="tower-info">
                        <div class="tower-name">冰冻塔</div>
                        <div class="tower-cost">💰 150</div>
                    </div>
                </div>
                <div class="tower-slot" data-tower="rocket">
                    <div class="tower-icon" style="background: #ff9f4a;">🚀</div>
                    <div class="tower-info">
                        <div class="tower-name">导弹塔</div>
                        <div class="tower-cost">💰 350</div>
                    </div>
                </div>
                <div class="tower-slot" data-tower="tesla">
                    <div class="tower-icon" style="background: #b84aff;">⚡</div>
                    <div class="tower-info">
                        <div class="tower-name">电磁塔</div>
                        <div class="tower-cost">💰 300</div>
                    </div>
                </div>
            </div>

            <!-- 开始波次按钮 -->
            <button id="start-wave-btn">开始波次 ▶</button>

            <!-- 塔信息面板 -->
            <div id="tower-info-panel" class="hidden">
                <div class="panel-header">
                    <span id="selected-tower-name">机枪塔</span>
                    <span id="selected-tower-level">Lv.1</span>
                </div>
                <div class="panel-stats">
                    <div>伤害: <span id="selected-tower-damage">10</span></div>
                    <div>射程: <span id="selected-tower-range">100</span></div>
                </div>
                <div class="panel-actions">
                    <button id="upgrade-tower-btn">升级 💰<span id="upgrade-cost">50</span></button>
                    <button id="sell-tower-btn">出售 💰<span id="sell-value">50</span></button>
                </div>
            </div>
        </div>

        <!-- 菜单界面 -->
        <div id="menu-screen" class="screen">
            <h1>🌟 星际防线 🌟</h1>
            <h2>Starfall Defense</h2>
            <p>保卫人类最后的殖民地，抵御外星虫族入侵！</p>
            <button id="start-game-btn" class="menu-btn">开始游戏</button>
            <div class="instructions">
                <h3>游戏说明</h3>
                <ul>
                    <li>点击下方塔图标选择防御塔</li>
                    <li>在地图上点击绿色格子放置塔</li>
                    <li>点击已有的塔可升级或出售</li>
                    <li>阻止敌人到达终点！</li>
                </ul>
            </div>
        </div>

        <!-- 游戏结束界面 -->
        <div id="gameover-screen" class="screen hidden">
            <h1 id="gameover-title">游戏结束</h1>
            <p id="gameover-message">殖民地沦陷了...</p>
            <div id="gameover-stats">
                <div>坚持到第 <span id="final-wave">0</span> 波</div>
                <div>击杀敌人: <span id="final-kills">0</span></div>
            </div>
            <button id="restart-btn" class="menu-btn">重新开始</button>
        </div>

        <!-- 暂停界面 -->
        <div id="pause-screen" class="screen hidden">
            <h1>游戏暂停</h1>
            <button id="resume-btn" class="menu-btn">继续游戏</button>
        </div>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/map.js"></script>
    <script src="js/projectile.js"></script>
    <script src="js/enemy.js"></script>
    <script src="js/tower.js"></script>
    <script src="js/wave.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/game.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
